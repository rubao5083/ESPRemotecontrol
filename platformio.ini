; PlatformIO Project Configuration File - ESPRemotecontrol
;
; Este projeto contém DOIS firmwares (ambientes), no mesmo repositório:
;
;   [env:lcd_display]  -> Vai no Waveshare ESP32-S3 Touch LCD 4.3" (src/lcd_main)
;                          Tela touchscreen + IMU (inclinação) + controlador ESP-NOW
;
;   [env:relay_module]  -> Vai no módulo de relés ESP32 (src/relay_main)
;                          Recebe comandos via ESP-NOW e aciona os relés (luzes auxiliares)
;
; Build: platformio run -e lcd_display   (ou -e relay_module)
; Upload: platformio run -e lcd_display --target upload
;
; Veja README.md para detalhes de arquitetura e decisão de protocolo (ESP-NOW).
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lcd_display

; ---------------------------------------------------------------------------
; Configurações comuns a ambos os ambientes
; ---------------------------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -I lib/remote_link
    -w

; ---------------------------------------------------------------------------
; Firmware da TELA (Waveshare ESP32-S3 Touch LCD 4.3")
; ---------------------------------------------------------------------------
[env:lcd_display]
extends = env
board = WAVESHARE-ESP-LCD
build_src_filter = +<lcd_main/*> -<relay_main/*>

lib_deps =
    lvgl/lvgl@^8.4.0

lib_ldf_mode = deep

build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    -I lib
    -I lib/lvgl_port
    -I lib/rgb_lcd_port
    -I lib/ch422g
    -I lib/i2c
    -I lib/touch
    -I lib/imu_qmi8658
    -I lib/battery_ina219
    -I src
    -I src/lcd_main

; ---------------------------------------------------------------------------
; Firmware do MÓDULO DE RELÉS (placa "ESP32_Relay_30A_X4", ESP32-WROOM-32E -
; ESP32 clássico, NÃO é S3; substituiu a Waveshare ESP32-S3-Relay-6CH).
; "esp32dev" = definição genérica de devkit ESP32-WROOM-32, compatível com
; o pinout desta placa (confirmado pela comunidade ESPHome).
; ---------------------------------------------------------------------------
[env:relay_module]
extends = env
board = esp32dev
; A tabela de particoes padrao do esp32dev (~1.31MB de app) nao cabe mais o
; firmware desde que ESP-NOW/WiFi + BluetoothSerial (Classico, para o
; ELM327) passaram a coexistir aqui - "huge_app.csv" da ~3MB de app (sem
; slot de OTA, que este projeto nao usa).
board_build.partitions = huge_app.csv
build_src_filter = +<relay_main/*> -<lcd_main/*> -<relay_pinscan/*>
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    ; ESP32-WROOM-32E (classico) nao tem USB nativo - sobrescreve a flag
    ; comum (pensada para o ESP32-S3 da tela) para no usar o USBSerial/CDC.
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I lib/imu_mpu6050
    -I src
    -I src/relay_main

; ---------------------------------------------------------------------------
; Ambiente TEMPORARIO de diagnostico: testa o MPU6050 isolado (SEM Bluetooth
; Classico/ELM327, SEM ESP-NOW/WiFi, SEM reles) para descobrir se um erro
; intermitente de I2C (ESP_ERR_INVALID_STATE) visto em bancada e hardware
; (fiacao/pull-up/modulo) ou interferencia de outra parte do firmware
; relay_main. Grava na placa de reles (ESP32-WROOM-32E). Remover depois de
; concluir o diagnostico. Regrave -e relay_module depois do teste.
; ---------------------------------------------------------------------------
[env:mpu6050_test]
extends = env
board = esp32dev
build_src_filter = +<mpu6050_test/*> -<lcd_main/*> -<relay_main/*> -<relay_pinscan/*> -<obd2_scan/*> -<obd2_scan_classic/*>
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I src
    -I src/mpu6050_test

; ---------------------------------------------------------------------------
; Ambiente TEMPORARIO de diagnostico: varre candidatos de GPIO procurando
; quais realmente acionam os reles desta placa (ver docs/HISTORICO-DEPURACAO.md).
; Remover depois de identificar o pinout real.
; ---------------------------------------------------------------------------
[env:relay_pinscan]
extends = env
board = esp32dev
build_src_filter = +<relay_pinscan/*> -<lcd_main/*> -<relay_main/*> -<obd2_scan/*>
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I src
    -I src/relay_pinscan

; ---------------------------------------------------------------------------
; Ambiente TEMPORARIO de diagnostico: conecta via BLE num adaptador OBD-II
; (candidato atual: scanner "V800" / app INNOOBD+) e despeja servicos/
; caracteristicas GATT no Serial, para descobrir o protocolo real antes de
; implementar o cliente OBD-II definitivo (ver Roadmap no README.md).
; Grava na placa da TELA (ESP32-S3), unico chip dos dois com BLE.
; ---------------------------------------------------------------------------
[env:obd2_scan]
extends = env
board = WAVESHARE-ESP-LCD
build_src_filter = +<obd2_scan/*> -<lcd_main/*> -<relay_main/*> -<relay_pinscan/*>
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    -I src
    -I src/obd2_scan

; ---------------------------------------------------------------------------
; Mesmo firmware de diagnostico acima, mas para gravar na placa de RELES
; (ESP32-WROOM-32E classico - tambem tem BLE, so nao tem USB nativo). Util
; para testar o adaptador OBD-II em bancada quando essa placa ja esta
; conectada ao adaptador USB-serial, sem precisar montar a tela. ATENCAO:
; grava por cima do firmware relay_module - regrave -e relay_module depois
; de terminar o teste para devolver a placa a sua funcao normal.
; ---------------------------------------------------------------------------
[env:obd2_scan_relayboard]
extends = env
board = esp32dev
build_src_filter = +<obd2_scan/*> -<lcd_main/*> -<relay_main/*> -<relay_pinscan/*>
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I src
    -I src/obd2_scan

; ---------------------------------------------------------------------------
; Ambiente TEMPORARIO de diagnostico Bluetooth CLASSICO (SPP) - conecta num
; ELM327 Bluetooth Classico comum (via BluetoothSerial, embutida no core) e
; abre uma ponte serial transparente. So pode gravar na placa de RELES
; (ESP32-WROOM-32E classico, tem BT Classico de verdade) - a tela (ESP32-S3)
; NAO tem Bluetooth Classico, so BLE (ver README.md). ATENCAO: grava por cima
; do firmware relay_module - regrave -e relay_module depois do teste.
; ---------------------------------------------------------------------------
[env:obd2_scan_classic]
extends = env
board = esp32dev
build_src_filter = +<obd2_scan_classic/*> -<lcd_main/*> -<relay_main/*> -<relay_pinscan/*> -<obd2_scan/*>
lib_ldf_mode = chain
build_flags =
    ${env.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I src
    -I src/obd2_scan_classic
